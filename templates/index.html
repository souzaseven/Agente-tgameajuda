<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente tgameajuda</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />

  <!-- Aplica tema salvo antes de renderizar para evitar flash -->
  <script>
    // Tema
    (function () {
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();

    // Redireciona chamadas /api/* para api.php?rota=... considerando subdiretório
    const origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && url.startsWith('/api/')) {
        const rota = url.substring(5); // remove '/api/'
        // Caminho relativo ao index.html
        let base = window.location.pathname;
        // Se estiver em /templates/, volta um nível
        if (base.includes('/templates/')) {
          base = base.substring(0, base.lastIndexOf('/templates/')) + '/';
        } else if (!base.endsWith('/')) {
          base = base.substring(0, base.lastIndexOf('/') + 1);
        }
        url = base + 'api.php?rota=' + encodeURIComponent(rota);
      }
      return origFetch(url, opts);
    };
  </script>

  <style>
    /* ── Variáveis de tema ── */
    :root {
      --bg-page:         #f0f2f5;
      --bg-header:       #1a1a2e;
      --bg-input-area:   #ffffff;
      --bg-bubble-agent: #ffffff;
      --bg-bubble-user:  #1a73e8;
      --bg-modal:        #ffffff;
      --bg-input:        #ffffff;
      --bg-badge:        #ebf8ff;
      --bg-code:         #f0f2f5;
      --bg-pre:          #1a202c;
      --text-primary:    #1a202c;
      --text-secondary:  #718096;
      --text-meta:       #a0aec0;
      --text-pre:        #e2e8f0;
      --text-badge:      #2b6cb0;
      --border:          #e2e8f0;
      --border-badge:    #bee3f8;
      --border-input:    #e2e8f0;
      --shadow:          rgba(0,0,0,.08);
      --scrollbar:       #cbd5e0;
      --dot-online:      #48bb78;
    }

    [data-theme="dark"] {
      --bg-page:         #111827;
      --bg-header:       #0d1117;
      --bg-input-area:   #1f2937;
      --bg-bubble-agent: #1e293b;
      --bg-bubble-user:  #1a73e8;
      --bg-modal:        #1e293b;
      --bg-input:        #374151;
      --bg-badge:        #1e3a5f;
      --bg-code:         #374151;
      --bg-pre:          #0d1117;
      --text-primary:    #f1f5f9;
      --text-secondary:  #94a3b8;
      --text-meta:       #64748b;
      --text-pre:        #e2e8f0;
      --text-badge:      #93c5fd;
      --border:          #334155;
      --border-badge:    #1e40af;
      --border-input:    #475569;
      --shadow:          rgba(0,0,0,.35);
      --scrollbar:       #475569;
      --dot-online:      #4ade80;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-page);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background .2s;
    }

    /* ── Header ── */
    header {
      background: var(--bg-header);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      transition: background .2s;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .avatar {
      width: 38px; height: 38px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .agent-name { font-size: 15px; font-weight: 600; }
    .agent-sub  { font-size: 11px; color: #90a0b7; display: flex; align-items: center; gap: 5px; }

    .dot-online {
      width: 7px; height: 7px;
      background: var(--dot-online);
      border-radius: 50%;
      display: inline-block;
    }

    .header-actions { display: flex; gap: 6px; }

    .btn {
      padding: 6px 13px;
      border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 500;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-ghost  { background: rgba(255,255,255,.1); color: #fff; }
    .btn-ghost:hover  { background: rgba(255,255,255,.22); }
    .btn-icon   { background: rgba(255,255,255,.1); color: #fff; padding: 6px 10px; font-size: 16px; }
    .btn-icon:hover   { background: rgba(255,255,255,.22); }
    .btn-danger { background: rgba(229,62,62,.2); color: #fc8181; }
    .btn-danger:hover { background: rgba(229,62,62,.35); }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .msgs-inner {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Message ── */
    .msg { display: flex; flex-direction: column; max-width: 78%; animation: fadeUp .22s ease; }
    .msg.user  { align-self: flex-end; }
    .msg.agent { align-self: flex-start; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
      transition: background .2s, color .2s;
    }

    .msg.user  .bubble {
      background: var(--bg-bubble-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent .bubble {
      background: var(--bg-bubble-agent);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .msg-meta {
      font-size: 11px;
      color: var(--text-meta);
      margin-top: 3px;
      padding: 0 3px;
    }
    .msg.user .msg-meta { text-align: right; }

    /* ── Tool badges ── */
    .tools { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
    .tool-badge {
      background: var(--bg-badge);
      color: var(--text-badge);
      border: 1px solid var(--border-badge);
      border-radius: 12px;
      padding: 2px 9px;
      font-size: 11px; font-weight: 500;
    }

    /* ── Typing indicator ── */
    #typing {
      align-self: flex-start;
      background: var(--bg-bubble-agent);
      border-radius: 16px; border-bottom-left-radius: 4px;
      padding: 12px 16px;
      box-shadow: 0 1px 4px var(--shadow);
      display: none;
      animation: fadeUp .22s ease;
    }
    #typing.active { display: flex; align-items: center; gap: 4px; }

    .dot-bounce {
      width: 7px; height: 7px;
      background: var(--text-meta);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .dot-bounce:nth-child(2) { animation-delay: .18s; }
    .dot-bounce:nth-child(3) { animation-delay: .36s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-7px); }
    }

    /* ── Input area ── */
    .input-area {
      background: var(--bg-input-area);
      border-top: 1px solid var(--border);
      padding: 14px 16px 16px;
      flex-shrink: 0;
      transition: background .2s;
    }

    .input-row {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #userInput {
      flex: 1;
      padding: 11px 14px;
      border: 2px solid var(--border-input);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color .2s, background .2s, color .2s;
      min-height: 44px;
      max-height: 140px;
      line-height: 1.5;
      background: var(--bg-input);
      color: var(--text-primary);
    }
    #userInput:focus { border-color: #1a73e8; }
    #userInput::placeholder { color: var(--text-secondary); }

    #sendBtn {
      height: 44px; min-width: 44px;
      padding: 0 16px;
      background: #1a73e8; color: #fff;
      border: none; border-radius: 12px;
      cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      flex-shrink: 0;
    }
    #sendBtn:hover:not(:disabled) { background: #1557b0; }
    #sendBtn:disabled { background: #a0aec0; cursor: not-allowed; }

    .input-hint {
      max-width: 820px; margin: 6px auto 0;
      font-size: 11px; color: var(--text-meta); text-align: center;
    }

    /* ── Modal ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--bg-modal);
      border-radius: 12px;
      padding: 24px;
      min-width: 320px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      transition: background .2s;
    }
    .modal h2 { font-size: 15px; margin-bottom: 14px; color: var(--text-primary); }

    .srow {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .srow:last-of-type { border-bottom: none; }
    .srow .lbl { color: var(--text-secondary); }
    .srow .val { font-weight: 500; color: var(--text-primary); text-align: right; max-width: 60%; word-break: break-all; }

    .modal-err { color: #fc8181; font-size: 13px; padding: 8px 0; }

    .modal-close {
      margin-top: 16px; width: 100%;
      padding: 10px;
      background: #1a1a2e; color: #fff;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px;
      transition: background .15s;
    }
    .modal-close:hover { background: #2d2d4e; }

    /* ── Markdown ── */
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; }
    .bubble code {
      background: var(--bg-code);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'Courier New', monospace; font-size: 12px;
      color: var(--text-primary);
    }
    .msg.user .bubble code { background: rgba(255,255,255,.2); color: #fff; }
    .bubble pre {
      background: var(--bg-pre); color: var(--text-pre);
      padding: 12px; border-radius: 8px;
      overflow-x: auto; margin: 8px 0; font-size: 12px;
    }
    .bubble pre code { background: none; padding: 0; color: var(--text-pre); }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }
    .bubble h1,.bubble h2,.bubble h3 { margin: 8px 0 4px; color: var(--text-primary); }
    .bubble h1 { font-size: 16px; } .bubble h2 { font-size: 15px; } .bubble h3 { font-size: 14px; }
    .bubble hr  { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    /* Scrollbar */
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    @media (max-width: 600px) {
      .msg { max-width: 94%; }
      #chat { padding: 14px 10px; }
      .header-actions .btn-text { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar">🤖</div>
    <div>
      <div class="agent-name">Agente tgameajuda</div>
      <div class="agent-sub"><span class="dot-online"></span>Assistente Inteligente de Help Desk</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-icon" id="themeBtn" onclick="toggleTheme()" title="Alternar tema"></button>
    <button class="btn btn-ghost" onclick="openStatus()"><span class="btn-text">Status</span></button>
    <button class="btn btn-danger" onclick="clearChat()"><span class="btn-text">Limpar conversa</span></button>
  </div>
</header>

<div id="chat">
  <div class="msgs-inner" id="msgsInner">
    <div id="typing">
      <div class="dot-bounce"></div>
      <div class="dot-bounce"></div>
      <div class="dot-bounce"></div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="userInput"
      placeholder="Digite sua mensagem… (Enter para enviar, Shift+Enter para nova linha)"
      rows="1"
    ></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="input-hint">Movidesk · ERP Delphi · Base de Conhecimento</div>
</div>

<div class="overlay" id="overlay" onclick="closeStatusIfBg(event)">
  <div class="modal">
    <h2>Status do Agente</h2>
    <div id="statusContent"></div>
    <button class="modal-close" onclick="closeStatus()">Fechar</button>
  </div>
</div>

<script>
  /* ── Tema ── */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', t);
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  // Aplica ícone correto no carregamento (tema já foi aplicado no <head>)
  window.addEventListener('DOMContentLoaded', () => {
    const t = localStorage.getItem('theme') || 'light';
    document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  });

  /* ── Refs ── */
  const chatEl   = document.getElementById('chat');
  const inner    = document.getElementById('msgsInner');
  const inputEl  = document.getElementById('userInput');
  const sendBtn  = document.getElementById('sendBtn');
  const typingEl = document.getElementById('typing');

  const TOOL_LABELS = {
    analisar_ticket:          '🎫 Analisou ticket',
    redigir_resposta:         '✍️ Redigiu resposta',
    priorizar_fila:           '📋 Priorizou fila',
    analisar_metricas:        '📊 Analisou métricas',
    buscar_base_conhecimento: '📖 Consultou base de conhecimento',
  };

  /* ── Utils ── */
  function esc(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function md(text) {
    let h = esc(text);
    h = h.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    h = h.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    h = h.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g,      '<em>$1</em>');
    h = h.replace(/^---$/gm, '<hr>');
    h = h.replace(/^[-•] (.+)$/gm,   '<li>$1</li>');
    h = h.replace(/^\d+\. (.+)$/gm,  '<li>$1</li>');
    h = h.replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g, m => `<ul>${m}</ul>`);
    h = h.replace(/\n/g, '<br>');
    return h;
  }

  function now() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  /* ── Render mensagem ── */
  function addMsg(role, text, tools = []) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    if (role === 'agent' && tools.length) {
      const badges = document.createElement('div');
      badges.className = 'tools';
      tools.forEach(t => {
        const b = document.createElement('span');
        b.className = 'tool-badge';
        b.textContent = TOOL_LABELS[t] || t;
        badges.appendChild(b);
      });
      wrap.appendChild(badges);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'agent'
      ? md(text)
      : esc(text).replace(/\n/g, '<br>');
    wrap.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = now();
    wrap.appendChild(meta);

    inner.insertBefore(wrap, typingEl);
    scrollBottom();
  }

  /* ── Loading ── */
  function setLoading(on) {
    sendBtn.disabled = on;
    inputEl.disabled = on;
    typingEl.classList.toggle('active', on);
    scrollBottom();
  }

  /* ── Enviar ── */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMsg('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    setLoading(true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Erro ${res.status}`);
      }

      const data = await res.json();
      addMsg('agent', data.text, data.tools_used || []);
    } catch (e) {
      addMsg('agent', `⚠️ ${e.message}`);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  /* ── Limpar ── */
  async function clearChat() {
    if (!confirm('Limpar todo o histórico da conversa?')) return;
    await fetch('/api/limpar', { method: 'POST' }).catch(() => {});
    [...inner.querySelectorAll('.msg')].forEach(el => el.remove());
    addMsg('agent', 'Histórico limpo. Como posso ajudar?');
  }

  /* ── Status ── */
  async function openStatus() {
    const el = document.getElementById('statusContent');
    el.innerHTML = '<p style="color:var(--text-secondary);font-size:13px">Carregando…</p>';
    document.getElementById('overlay').classList.add('open');

    try {
      const res = await fetch('/api/status');

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        el.innerHTML = `<p class="modal-err">⚠️ ${err.detail || `Erro ${res.status}`}</p>`;
        return;
      }

      const d = await res.json();
      el.innerHTML = `
        <div class="srow"><span class="lbl">Modelo</span><span class="val">${d.model}</span></div>
        <div class="srow"><span class="lbl">Max tokens</span><span class="val">${d.max_tokens.toLocaleString('pt-BR')}</span></div>
        <div class="srow"><span class="lbl">Turnos no histórico</span><span class="val">${d.turns_in_history} / ${d.max_history_turns * 2}</span></div>
        <div class="srow"><span class="lbl">Ferramentas</span><span class="val">${d.tools_available.length} disponíveis</span></div>
      `;
    } catch (e) {
      el.innerHTML = `<p class="modal-err">⚠️ Falha de conexão: ${e.message}</p>`;
    }
  }

  function closeStatus() { document.getElementById('overlay').classList.remove('open'); }
  function closeStatusIfBg(e) { if (e.target === document.getElementById('overlay')) closeStatus(); }

  /* ── Textarea auto-resize + Enter ── */
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ── Intro ── */
  (async () => {
    setLoading(true);
    try {
      const res = await fetch('/api/intro');
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Erro ${res.status}`);
      const d = await res.json();
      addMsg('agent', d.text);
    } catch (e) {
      addMsg('agent', `⚠️ Não foi possível iniciar o agente: ${e.message}`);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  })();
</script>
</body>
</html>
